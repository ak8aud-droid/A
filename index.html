<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AK8 GAMING VIP - Official Support Hub</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body {
            background-color: #120808;
            color: #fef2f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at top, #2b0c0c 0%, #120808 100%);
        }
        .card {
            background-color: #1f0f0f;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #7f1d1d;
        }
        .brand-logo {
            width: 110px;
            height: auto;
            margin-bottom: 16px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4));
        }
        h2 {
            color: #fef2f2;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 20px;
            font-weight: 600;
        }
        p {
            color: #fca5a5;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 12px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-platform {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        .btn-feedback {
            background-color: transparent;
            color: #f87171;
            border: 1px solid #ef4444;
            box-shadow: none;
        }
        .btn-feedback:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* 彈跳視窗樣式 (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-box {
            background: #1f0f0f;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            text-align: left;
            border: 1px solid #ef4444;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.3);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            color: #fca5a5;
            font-size: 20px;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-close:hover { color: #fef2f2; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: #fecaca; margin-bottom: 6px; }
        .form-input, .form-textarea {
            width: 100%;
            background: #120808;
            border: 1px solid #7f1d1d;
            border-radius: 8px;
            padding: 10px 12px;
            color: #fef2f2;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }
        .form-input:focus, .form-textarea:focus { border-color: #ef4444; }
        .form-textarea { resize: vertical; height: 90px; }
        
        .form-submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fef2f2;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 4px;
            transition: opacity 0.2s;
        }
        .form-submit-btn:hover { opacity: 0.9; }

        /* 滑塊驗證條 */
        .slider-track {
            position: relative;
            width: 100%;
            height: 46px;
            background: #120808;
            border-radius: 23px;
            margin-top: 16px;
            border: 1px solid #7f1d1d;
            overflow: hidden;
        }
        .slider-text {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fca5a5;
        }
        .slider-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 46px;
            height: 46px;
            background: #ef4444;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 抓取你上傳到 GitHub 根目錄的 logo.png -->
        <img src="logo.gif" alt="AK8 Logo" class="brand-logo" onerror="this.style.display='none'">

        <h2>Live Support Service</h2>
        <p>Your session is ready. Choose an option below to connect with us.</p>

        <!-- WhatsApp 按鈕 -->
        <a href="javascript:void(0);" onclick="trackAndRedirect('whatsapp', 'https://dub.sh/candycandy')" rel="noreferrer" class="btn">Connect to WhatsApp</a>
        
        <!-- Claim Bonus 按鈕 -->
        <a href="javascript:void(0);" onclick="trackAndRedirect('bonus', 'https://dub.sh/videochatroom')" rel="noreferrer" class="btn btn-platform">Claim Bonus</a>

        <!-- 建議投訴按鈕 -->
        <a href="javascript:void(0);" onclick="openFeedbackModal()" class="btn btn-feedback">Feedback & Complaints</a>
    </div>

    <!-- 意見與投訴留言彈窗 -->
    <div class="modal" id="feedbackModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeFeedbackModal()">&times;</button>
            <h3 style="font-size:18px; margin-bottom:4px; color:#f87171;">Feedback & Complaints</h3>
            <p style="font-size:12px; color:#fca5a5; margin-bottom:16px;">Leave your message. We will review it shortly.</p>
            
            <div class="form-group">
                <label>Name (Optional)</label>
                <input type="text" class="form-input" id="fbName" placeholder="Your name...">
            </div>
            <div class="form-group">
                <label>Phone / Contact (Optional)</label>
                <input type="text" class="form-input" id="fbPhone" placeholder="Your phone number...">
            </div>
            <div class="form-group">
                <label>Message / Complaint (Required)</label>
                <textarea class="form-textarea" id="fbMessage" placeholder="Type your message here..."></textarea>
            </div>
            
            <button class="form-submit-btn" onclick="prepareFeedbackSubmit()">Submit Feedback</button>
        </div>
    </div>

    <!-- 滑塊驗證彈窗 (Captcha Modal) -->
    <div class="modal" id="captchaModal">
        <div class="modal-box" style="text-align: center;">
            <h3 style="font-size:16px; margin-bottom:4px; color:#f87171;">Security Verification</h3>
            <p style="font-size:12px; color:#fca5a5;" id="captchaDesc">Slide to complete submission</p>
            <div class="slider-track" id="sliderTrack">
                <div class="slider-text">Slide to unlock ➔</div>
                <div class="slider-btn" id="sliderBtn">➔</div>
            </div>
        </div>
    </div>

<script>
    function trackAndRedirect(eventLabel, targetUrl) {
        if (typeof gtag === 'function') {
            gtag('event', 'click_' + eventLabel, {
                'event_category': 'Outbound',
                'event_label': eventLabel + ' Redirection'
            });
        }
        setTimeout(function() {
            window.location.href = targetUrl;
        }, 200);
    }

    function openFeedbackModal() {
        document.getElementById('feedbackModal').style.display = 'flex';
    }
    
    function closeFeedbackModal() {
        document.getElementById('feedbackModal').style.display = 'none';
    }

    // 點擊送出按鈕先檢查內容，有填寫則關閉表單、跳出滑塊驗證
    function prepareFeedbackSubmit() {
        const messageInput = document.getElementById('fbMessage').value.trim();
        if (!messageInput) {
            alert('Please enter your message or complaint.');
            return;
        }
        closeFeedbackModal();
        document.getElementById('captchaModal').style.display = 'flex';
        initSlider();
    }

    // 初始化滑塊驗證
    function initSlider() {
        const btn = document.getElementById('sliderBtn');
        const track = document.getElementById('sliderTrack');
        btn.style.left = '0px';
        let isDragging = false;
        let startX = 0;

        btn.onmousedown = btn.ontouchstart = (e) => {
            isDragging = true;
            startX = (e.touches ? e.touches[0].clientX : e.clientX);
        };

        document.onmousemove = document.ontouchmove = (e) => {
            if (!isDragging) return;
            let currentX = (e.touches ? e.touches[0].clientX : e.clientX);
            let diff = currentX - startX;
            let maxDiff = track.clientWidth - btn.clientWidth;

            if (diff < 0) diff = 0;
            if (diff > maxDiff) diff = maxDiff;

            btn.style.left = diff + 'px';

            if (diff >= maxDiff - 5) {
                isDragging = false;
                document.onmousemove = document.ontouchmove = null;
                onVerifySuccess();
            }
        };

        document.onmouseup = document.ontouchend = () => {
            if (isDragging) {
                isDragging = false;
                btn.style.left = '0px';
            }
        };
    }

    // 驗證成功後，透過你那套成功的 GET 請求方式發送到 Telegram
    function onVerifySuccess() {
        document.getElementById('captchaModal').style.display = 'none';

        const nameInput = document.getElementById('fbName').value.trim() || 'Anonymous';
        const phoneInput = document.getElementById('fbPhone').value.trim() || 'Not provided';
        const messageInput = document.getElementById('fbMessage').value.trim();

        const text = `🚨 *New Website Feedback / Complaint*\n\n` +
                     `👤 *Name:* ${nameInput}\n` +
                     `📞 *Phone:* ${phoneInput}\n` +
                     `💬 *Message:* ${messageInput}`;

        const encBotToken = 'ODU2MDc4NDY5NjpBQUczci16VEQ5MlBSU21HcTlNR3lFOXg0eXF4dTZOcmJuVQ==';
        const encChatId = 'ODcwOTUxNzEyOQ==';

        const botToken = atob(encBotToken);
        const chatId = atob(encChatId);
        const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert('Thank you! Your feedback has been sent successfully.');
                    document.getElementById('fbName').value = '';
                    document.getElementById('fbPhone').value = '';
                    document.getElementById('fbMessage').value = '';
                } else {
                    alert('Failed to send. Please try again later.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while sending feedback.');
            });
    }
</script>

</body>
</html>
