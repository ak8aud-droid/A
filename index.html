<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Support Service</title>

    <!-- Google tag (gtag.js) - GA4 Tracking -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F3TZDNXZFF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-F3TZDNXZFF');
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 380px;
            width: 88%;
            border: 1px solid #334155;
        }
        .brand-logo {
            width: 90px;
            height: auto;
            margin-bottom: 16px;
            object-fit: contain;
        }
        h2 {
            color: #f8fafc;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: 600;
        }
        p {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 12px;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-platform {
            background-color: #6366f1;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }
        .btn-feedback {
            background-color: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            box-shadow: none;
        }
        .btn-feedback:hover {
            background-color: rgba(56, 189, 248, 0.1);
        }

        /* 彈跳視窗樣式 (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-card {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .modal-title {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 4px 0;
        }
        .modal-subtitle {
            color: #94a3b8;
            font-size: 12px;
            margin: 0;
        }
        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .close-btn:hover {
            color: #f8fafc;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .form-input, .form-textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            color: #f8fafc;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-textarea:focus {
            border-color: #38bdf8;
        }
        .form-textarea {
            resize: vertical;
            height: 90px;
        }
        .submit-btn {
            width: 100%;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 4px;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>

    <script>
        function trackAndRedirect(eventLabel, targetUrl) {
            if (typeof gtag === 'function') {
                gtag('event', 'click_' + eventLabel, {
                    'event_category': 'Outbound',
                    'event_label': eventLabel + ' Redirection'
                });
            }
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 200);
        }

        // 打開建議投訴彈窗
        function openFeedbackModal() {
            document.getElementById('feedbackModal').style.display = 'flex';
        }

        // 關閉建議投訴彈窗
        function closeFeedbackModal() {
            document.getElementById('feedbackModal').style.display = 'none';
            document.getElementById('feedbackForm').reset();
        }

        // 提交表單至 Telegram
        function submitFeedback(event) {
            event.preventDefault();
            
            const name = document.getElementById('fbName').value || '未填寫';
            const phone = document.getElementById('fbPhone').value || '未填寫';
            const message = document.getElementById('fbMessage').value;

            if (!message.trim()) {
                alert('請填寫留言內容！');
                return;
            }

            // Bot Token 已填入，請將 YOUR_CHAT_ID 換成你的 Telegram Chat ID 數字
            const botToken = '8560784696:AAG3r-zTD92PRSmGq9MgYEx4yqxu6NrbnU'; 
            const chatId = 'YOUR_CHAT_ID';

            const text = `📢 【新建議與投訴】\n👤 名字: ${name}\n📞 電話: ${phone}\n💬 內容:\n${message}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '發送中...';

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: text
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert('感謝您的回饋，已成功送出！');
                    closeFeedbackModal();
                } else {
                    alert('發送失敗，請確認 Chat ID 是否正確。');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('發生錯誤，請檢查網路連線。');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Feedback';
            });
        }
    </script>
</head>
<body>

    <div class="card">
        <!-- Logo -->
        <img src="image_62955f.png" alt="AK8 Logo" class="brand-logo">

        <h2>Live Support Service</h2>
        <p>Your session is ready. Choose an option below to connect with us.</p>

        <!-- WhatsApp 按鈕 -->
        <a href="javascript:void(0);" onclick="trackAndRedirect('whatsapp', 'https://dub.sh/candycandy')" rel="noreferrer" class="btn">Connect to WhatsApp</a>
        
        <!-- 平台選項按鈕 -->
        <a href="javascript:void(0);" onclick="trackAndRedirect('platform', 'https://dub.sh/videochatroom')" rel="noreferrer" class="btn btn-platform">Platform Chat Room</a>

        <!-- 建議投訴按鈕 -->
        <a href="javascript:void(0);" onclick="openFeedbackModal()" class="btn btn-feedback">Feedback & Complaints</a>
    </div>

    <!-- 建議與投訴彈跳視窗 -->
    <div class="modal-overlay" id="feedbackModal">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <h3 class="modal-title">Feedback & Complaints</h3>
                    <p class="modal-subtitle">Leave your message. We will review it shortly.</p>
                </div>
                <button class="close-btn" onclick="closeFeedbackModal()">&times;</button>
            </div>
            
            <form id="feedbackForm" onsubmit="submitFeedback(event)">
                <div class="form-group">
                    <label class="form-label">Name (Optional)</label>
                    <input type="text" id="fbName" class="form-input" placeholder="Your name...">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone / Contact (Optional)</label>
                    <input type="text" id="fbPhone" class="form-input" placeholder="Your phone number...">
                </div>

                <div class="form-group">
                    <label class="form-label">Message / Complaint (Required)</label>
                    <textarea id="fbMessage" class="form-textarea" placeholder="Type your message here..." required></textarea>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Submit Feedback</button>
            </form>
        </div>
    </div>

</body>
</html>
