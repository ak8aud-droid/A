<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK8 - Live Support Service</title>

    <!-- Google tag (gtag.js) - GA4 Tracking -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F3TZDNXZFF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-F3TZDNXZFF');
    </script>

    <style>
        body {
            background-color: #120808;
            color: #fef2f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1f0f0f;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.15);
            text-align: center;
            max-width: 380px;
            width: 88%;
            border: 1px solid #7f1d1d;
        }
        .brand-logo {
            width: 110px;
            height: auto;
            margin-bottom: 16px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4));
        }
        h2 {
            color: #fef2f2;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: 600;
        }
        p {
            color: #fca5a5;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 12px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-platform {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        .btn-feedback {
            background-color: transparent;
            color: #f87171;
            border: 1px solid #ef4444;
            box-shadow: none;
        }
        .btn-feedback:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* 彈跳視窗樣式 (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-card {
            background-color: #1f0f0f;
            border: 1px solid #ef4444;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.3);
            text-align: left;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .modal-title {
            color: #f87171;
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 4px 0;
        }
        .modal-subtitle {
            color: #fca5a5;
            font-size: 12px;
            margin: 0;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fca5a5;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .close-btn:hover {
            color: #fef2f2;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            display: block;
            color: #fecaca;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .form-input, .form-textarea {
            width: 100%;
            background-color: #120808;
            border: 1px solid #7f1d1d;
            border-radius: 8px;
            padding: 10px 12px;
            color: #fef2f2;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-textarea:focus {
            border-color: #ef4444;
        }
        .form-textarea {
            resize: vertical;
            height: 90px;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fef2f2;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 4px;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>

    <script>
        function trackAndRedirect(eventLabel, targetUrl) {
            if (typeof gtag === 'function') {
                gtag('event', 'click_' + eventLabel, {
                    'event_category': 'Outbound',
                    'event_label': eventLabel + ' Redirection'
                });
            }
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 200);
        }

        function openFeedbackModal() {
            document.getElementById('feedbackModal').style.display = 'flex';
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').style.display = 'none';
            document.getElementById('feedbackForm').reset();
        }

        function submitFeedback(event) {
            event.preventDefault();
            
            const name = document.getElementById('fbName').value || 'Anonymous';
            const phone = document.getElementById('fbPhone').value || 'Not provided';
            const message = document.getElementById('fbMessage').value;

            if (!message.trim()) {
                alert('請填寫留言內容！');
                return;
            }

            const botToken = '8560784696:AAG3r-zTD92PRSmGq9MgYEx4yqxu6NrbnU'; 
            const chatId = '8709517129';

            const text = `🚨 New Website Feedback / Complaint\n\n👤 Name: ${name}\n📞 Phone: ${phone}\n💬 Message: ${message}`;
            
            // 使用隱藏 iframe 提交表單，完美避開 CORS 阻擋
            const iframeName = 'hidden_iframe_' + Date.now();
            let iframe = document.getElementById('hidden_iframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'hidden_iframe';
                iframe.name = iframeName;
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
            }

            const form = document.createElement('form');
            form.action = `https://api.telegram.org/bot${botToken}/sendMessage`;
            form.method = 'POST';
            form.target = iframeName;

            const chatInput = document.createElement('input');
            chatInput.type = 'hidden';
            chatInput.name = 'chat_id';
            chatInput.value = chatId;
            form.appendChild(chatInput);

            const textInput = document.createElement('input');
            textInput.type = 'hidden';
            textInput.name = 'text';
            textInput.value = text;
            form.appendChild(textInput);

            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);

            alert('感謝您的回饋，已成功送出！');
            closeFeedbackModal();
        }
    </script>
</head>
<body>

    <div class="card">
        <img src="logo.png" alt="AK8 Logo" class="brand-logo" onerror="this.style.display='none'">

        <h2>Live Support Service</h2>
        <p>Your session is ready. Choose an option below to connect with us.</p>

        <a href="javascript:void(0);" onclick="trackAndRedirect('whatsapp', 'https://dub.sh/candycandy')" rel="noreferrer" class="btn">Connect to WhatsApp</a>
        
        <a href="javascript:void(0);" onclick="trackAndRedirect('bonus', 'https://dub.sh/videochatroom')" rel="noreferrer" class="btn btn-platform">Claim Bonus</a>

        <a href="javascript:void(0);" onclick="openFeedbackModal()" class="btn btn-feedback">Feedback & Complaints</a>
    </div>

    <!-- 建議與投訴彈跳視窗 -->
    <div class="modal-overlay" id="feedbackModal">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <h3 class="modal-title">Feedback & Complaints</h3>
                    <p class="modal-subtitle">Leave your message. We will review it shortly.</p>
                </div>
                <button class="close-btn" onclick="closeFeedbackModal()">&times;</button>
            </div>
            
            <form id="feedbackForm" onsubmit="submitFeedback(event)">
                <div class="form-group">
                    <label class="form-label">Name (Optional)</label>
                    <input type="text" id="fbName" class="form-input" placeholder="Your name...">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone / Contact (Optional)</label>
                    <input type="text" id="fbPhone" class="form-input" placeholder="Your phone number...">
                </div>

                <div class="form-group">
                    <label class="form-label">Message / Complaint (Required)</label>
                    <textarea id="fbMessage" class="form-textarea" placeholder="Type your message here..." required></textarea>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Submit Feedback</button>
            </form>
        </div>
    </div>

</body>
</html>
